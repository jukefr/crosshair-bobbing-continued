modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/jukefr/crosshair-bobbing-continued/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="jukefr"
credits="Krash220 (original Crosshair Bobbing)"
iconFile="assets/crosshair-bobbing-continued/icon.png"
displayURL="https://modrinth.com/mod/crosshair-bobbing-continued"
