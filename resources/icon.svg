<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2e1c"/>
      <stop offset="1" stop-color="#17110a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="11" y="11" width="490" height="490" rx="87" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- bobbing motion arcs -->
  <g fill="none" stroke="#ffc857" stroke-linecap="round">
    <path d="M98 344 C56 274 70 184 136 138" stroke-width="15" opacity="0.95" filter="url(#soft)"/>
    <path d="M128 380 C82 302 90 204 144 160" stroke-width="12" opacity="0.45"/>
  </g>

  <!-- crosshair, tilted as the view bobs -->
  <g transform="rotate(12 256 232)" filter="url(#glow)">
    <g fill="none" stroke="#fffaf0" stroke-width="23" stroke-linecap="round">
      <circle cx="256" cy="232" r="106"/>
      <path d="M256 84 V134"/>
      <path d="M256 330 V380"/>
      <path d="M108 232 H158"/>
      <path d="M354 232 H404"/>
    </g>
    <circle cx="256" cy="232" r="15" fill="#fffaf0"/>
  </g>
</svg>
